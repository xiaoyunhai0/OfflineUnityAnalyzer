name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OfflineUnityAnalyzer.sln

      - name: Build
        run: dotnet build OfflineUnityAnalyzer.sln -c Release --no-restore

      - name: Test
        run: dotnet test OfflineUnityAnalyzer.sln -c Release --no-build
